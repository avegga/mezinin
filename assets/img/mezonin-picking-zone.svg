    <text x="144" y="1036" fill="#ddcfc0" font-family="Segoe UI, Arial, sans-serif" font-size="24">Настил, рабочий стол, коробки и проход для отбора заказов</text>
    <text x="144" y="1072" fill="#b99f8a" font-family="Segoe UI, Arial, sans-serif" font-size="20">Под e-commerce, упаковку и разделение потоков</text>
  </g>

  <g>
    <rect x="632" y="108" width="196" height="74" rx="18" fill="#f8f4ee" opacity="0.92"/>
    <text x="664" y="138" fill="#274941" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">ОПЕРАЦИОННЫЙ БЛОК</text>
    <text x="664" y="166" fill="#8d7568" font-family="Segoe UI, Arial, sans-serif" font-size="16">второй уровень</text>
