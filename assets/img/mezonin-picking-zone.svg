<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1200" role="img" aria-labelledby="title desc">
  <title id="title">Зона комплектации на мезонине</title>
  <desc id="desc">Каталожный визуал операционной зоны на мезонине: рабочий стол, коробки, проходы и ограждение второго уровня.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d7e0db"/>
      <stop offset="32%" stop-color="#f0f2ef"/>
      <stop offset="100%" stop-color="#d8c8b5"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#cd6d3f"/>
      <stop offset="100%" stop-color="#893b1d"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#48675e"/>
      <stop offset="100%" stop-color="#223d37"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#11100f" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="960" height="1200" fill="url(#bg)"/>
  <path d="M0 904L960 850V1200H0Z" fill="#8e7668"/>
  <path d="M0 932L960 880" stroke="#ccb39c" stroke-width="2" opacity="0.3"/>

