    <path d="M128 258H814L840 278H102Z" fill="url(#deck)"/>
    <path d="M90 720H856L882 742H64Z" fill="url(#deck)"/>

    <g fill="url(#steel)">
      <path d="M144 280H166V866H124Z"/>
