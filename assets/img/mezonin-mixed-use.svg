    <text x="180" y="842" fill="#f4efe8" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="700">Смешанный проект без нового строительства</text>
    <text x="180" y="884" fill="#decfc1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Хранение снизу, офис и рабочая зона сверху</text>
  </g>

