    <text x="1272" y="150" fill="#24453e" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="700">СМЕШАННЫЙ ОБЪЕКТ</text>
    <text x="1272" y="178" fill="#8d7568" font-family="Segoe UI, Arial, sans-serif" font-size="16">хранение + офис + сервис</text>
