<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Смешанный проект с мезонином</title>
  <desc id="desc">Каталожный визуал смешанного объекта: офисный блок на мезонине, нижний уровень хранения, рабочая зона и лестница.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#d6dfda"/>
      <stop offset="35%" stop-color="#eef1ee"/>
      <stop offset="100%" stop-color="#d7c7b4"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#826b5d"/>
      <stop offset="100%" stop-color="#67534a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#ca6a3d"/>
      <stop offset="100%" stop-color="#7d3418"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#4b6b63"/>
      <stop offset="100%" stop-color="#223c36"/>
    </linearGradient>
    <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" stitchTiles="stitch"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.04"/>
      </feComponentTransfer>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#11100f" flood-opacity="0.24"/>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <path d="M0 726L1600 648V980H0Z" fill="url(#floor)"/>
  <path d="M0 770L1600 694" stroke="#d8bea7" stroke-width="2" opacity="0.28"/>

  <g opacity="0.18">
    <rect x="118" y="86" width="120" height="286" fill="#ffffff"/>
    <rect x="258" y="86" width="120" height="286" fill="#ffffff"/>
    <rect x="398" y="86" width="120" height="286" fill="#ffffff"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M176 160H1430L1488 736H118Z" fill="#fbf7f2"/>
    <path d="M242 286H1360L1388 306H214Z" fill="url(#beam)"/>
    <path d="M206 584H1400L1428 604H178Z" fill="url(#beam)"/>

